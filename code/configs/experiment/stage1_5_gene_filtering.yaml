# Stage 1.5 — Gene filtering configuration (updated for chi² pre-filter)

name: stage1_5_gene_filtering
description: "Stage 1.5 — Gene importance computation + filtering for Pillar 2"

filtering:
  min_snps_per_gene: 5
  xgb_top_k_per_ab: 1500
  final_gene_cap: 5000

# Chi-squared pre-filter BEFORE XGBoost (fixes 0-importance bug)
prefilter:
  top_k: 50000          # top-K SNPs by chi² stat per antibiotic
  min_variance: 1.0e-6  # drop dead SNPs first

xgb_params:
  n_estimators: 500
  max_depth: 4
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 1.0   # was 0.5 — now reasonable since pre-filtered to 50K
  colsample_bynode: 0.5   # per-split diversity instead
  min_child_weight: 1
  tree_method: hist
  device: cuda
  early_stopping_rounds: 30
  eval_metric: aucpr

antibiotics: [AMP, CIP, AMC, SXT, GEN, CTX, CAZ]

memory:
  use_sparse: false
  chunk_size: 50000

output_dir: ${paths.results_dir}/stage1_5
output_pkl: ${paths.processed_dir}/arcadia_v2_gene_filtered.pkl

evaluation:
  bootstrap_n: 100
  bootstrap_seed: 42

wandb:
  project: amr-phylogene-mtl
  tags: [stage1_5, gene_filtering]
