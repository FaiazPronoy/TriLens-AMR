# configs/experiment/pillar3_xgb_importance.yaml
# Pillar 3 v2 — tree-based interpretability (replaces failed attention approach).
# Combines Plan B (XGB-gene), Plan C (XGB-raw-chi²), and cross-AB Jaccard.

name: pillar3_xgb_importance
description: "Pillar 3 v2 — XGB-based per-gene importance from CascadeStack v9 base learners, with cross-antibiotic Jaccard similarity and multi-drug marker identification."

antibiotics: [AMP, CIP, AMC, SXT, GEN, CTX, CAZ]
gene_stats: [mean, var, n_nonref, max]

# Toggle either plan independently
run_plan_b: true       # XGB gene-aggregated
run_plan_c: true       # XGB raw chi² (PRIMARY)

# Same chi²-prefilter knobs as v8/v9
prefilter_top_k: 50000
prefilter_min_variance: 1.0e-6

# XGB hyperparameters — IDENTICAL to v9 base learner configs
xgb_params:
  n_estimators: 1500
  max_depth: 5
  min_child_weight: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.7
  reg_alpha: 0.1
  reg_lambda: 1.0
  gamma: 0.1
  tree_method: hist
  device: cuda

xgb_raw_params:
  n_estimators: 1500
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 1.0
  colsample_bynode: 0.5
  reg_alpha: 0.1
  reg_lambda: 1.0
  tree_method: hist
  device: cuda

top_k: 20

output_dir: ${paths.results_dir}/pillar3_xgb_importance