# configs/experiment/pillar3_interpretability.yaml
# Pillar 3 — extract top-K genes per antibiotic from trained GeneAttentionNet

name: pillar3_interpretability
description: "Pillar 3 interpretability — top-K attention genes per antibiotic from the trained multi-task GeneAttentionNet. Excludes test split from ranking to keep model selection leak-free."

antibiotics: [AMP, CIP, AMC, SXT, GEN, CTX, CAZ]
gene_stats: [mean, var, n_nonref, max]

ckpt_path: ${paths.results_dir}/stage2_gene_attention/ckpts/stage2_gene_attention_best.ckpt

gan:
  max_epochs: 50
  hidden_dim: 128
  n_heads: 4
  n_layers: 2
  ffn_mult: 2
  dropout: 0.3
  learning_rate: 1.0e-3

top_k: 20
top_k_heatmap: 10

output_dir: ${paths.results_dir}/pillar3_interpretability
