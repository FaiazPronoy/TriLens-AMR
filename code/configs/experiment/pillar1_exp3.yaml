# configs/experiment/pillar1_exp3.yaml
# Pillar 1 Experiment 1.3 — Asymmetric position shuffling drop.
# Hypothesis: Giessen (real positional structure) shows ≥5% PR-AUC drop
# under column shuffling; Arcadia (pan-genome, broken locality) shows ≤2% drop.
# This is the cleanest mechanistic proof of the locality mismatch.

name: pillar1_exp3
description: "Pillar 1 Exp 1.3 — Position shuffling asymmetric drop test"

defaults:
  - /model: cnn_1d_naive

antibiotics: [CIP]   # single AB — strongest signal, lowest noise
datasets: [arcadia, giessen]
shuffle_seed: 42
output_dir: ${paths.results_dir}/pillar1/exp3

training:
  max_epochs: 30
  min_epochs: 5
  early_stop_patience: 8
  early_stop_metric: "val/pr_auc"
  early_stop_mode: "max"
  batch_size_arcadia: 16
  batch_size_giessen: 32
  num_workers: 4
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  gradient_clip: 1.0
  precision: "16-mixed"
  scheduler_t_max: 30

evaluation:
  bootstrap_n: 1000
  bootstrap_seed: 42

wandb:
  project: amr-phylogene-mtl
  tags: [pillar1, exp3, shuffling]
