# configs/experiment/pillar1_exp1.yaml
# Pillar 1 Experiment 1.1 — Controlled 1D CNN comparison Giessen vs Arcadia.
# Hypothesis: locality-assuming CNN trained with identical protocol on both
# datasets shows ≥0.10 PR-AUC gap (Arcadia worse), demonstrating pan-genome
# locality mismatch.

name: pillar1_exp1
description: "Pillar 1 Exp 1.1 — Controlled Giessen vs Arcadia 1D CNN comparison"

defaults:
  - /model: cnn_1d_naive

antibiotics: [CIP, CTX, GEN, CAZ]   # CAZ ≡ CTZ in Giessen
datasets: [arcadia, giessen]
output_dir: ${paths.results_dir}/pillar1/exp1

training:
  max_epochs: 30
  min_epochs: 5
  early_stop_patience: 8
  early_stop_metric: "val/pr_auc"
  early_stop_mode: "max"
  batch_size_arcadia: 16
  batch_size_giessen: 32
  num_workers: 4
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  gradient_clip: 1.0
  precision: "16-mixed"
  scheduler_t_max: 30

evaluation:
  bootstrap_n: 1000
  bootstrap_seed: 42

wandb:
  project: amr-phylogene-mtl
  tags: [pillar1, exp1, locality_mismatch]
