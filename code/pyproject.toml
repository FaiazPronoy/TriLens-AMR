[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trilens-moe-stack"
version = "0.1.0"
description = "Lineage-aware multi-drug antibiotic resistance prediction in E. coli from genomic data (TriLens-MoE-Stack)"
authors = [
    {name = "Faiaz Abrar Zaman Pronoy"}, {name = "Pranto Roy"}, {name = "Sinthia Khandoker"}, {name = "Shantanu Barua"}, {name = "Md. Jahirul Islam Zishan"}
]
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100