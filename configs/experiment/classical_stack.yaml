name: classical_stack
description: Five classical learners and a gene attention network on gene features, stacked by logistic regression
  with out-of-fold predictions.
antibiotics: [AMP, CIP, AMC, SXT, GEN, CTX, CAZ]
gene_stats: [mean, var, n_nonref, max]
n_folds: 5
use_lgbm: true
gan: {max_epochs: 15, batch_size: 16, learning_rate: 0.001, hidden_dim: 128, n_heads: 4, n_layers: 2, ffn_mult: 2,
  dropout: 0.3}
xgb_params: {n_estimators: 1500, max_depth: 5, min_child_weight: 5, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.7,
  reg_alpha: 0.1, reg_lambda: 1.0, gamma: 0.1, tree_method: hist, device: cuda, early_stopping_rounds: 150}
lgbm_params: {num_leaves: 63, max_depth: 6, min_child_samples: 20, learning_rate: 0.05, subsample: 0.8, subsample_freq: 1,
  colsample_bytree: 0.7, reg_alpha: 0.1, reg_lambda: 1.0, early_stopping_rounds: 150}
rf_params: {n_estimators: 200, max_depth: 12, min_samples_leaf: 10}
prefilter_top_k: 50000
prefilter_min_variance: 1.0e-06
xgb_raw_params: {n_estimators: 1500, max_depth: 5, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 1.0, colsample_bynode: 0.5,
  reg_alpha: 0.1, reg_lambda: 1.0, tree_method: hist, device: cuda, early_stopping_rounds: 150}
meta_C: 1.0
evaluation: {bootstrap_n: 1000, bootstrap_seed: 42}
output_dir: ${paths.results_dir}/classical_stack_random
split_key: random_split
