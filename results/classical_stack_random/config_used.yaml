data:
  name: arcadia
  paths:
    master_pkl: ${paths.processed_dir}/arcadia_v2_master_features.pkl
    snp_matrix_pkl: ${paths.processed_dir}/arcadia_v2_snp_matrix.pkl
  col_names:
    X_train: X_pca_train
    X_val: X_pca_val
    X_test: X_pca_test
    'Y': 'Y'
    label_mask: label_mask
    label_names: label_names
    random_split: random_split
    phylogeny_split: phylogeny_split
    phylogroup: phylogroup_onehot
    genome_names: genome_names
  antibiotics:
  - AMP
  - CIP
  - AMC
  - SXT
  - GEN
  - CTX
  - CAZ
  common_with_giessen:
  - CIP
  - CTX
  - GEN
  - CAZ
  n_samples: 6962
  n_pca_features: 1024
  n_snp_features: 535439
  n_phylogroups: 8
  split: random
  vocab_size: 5
  padding_idx: 4
  arcadia:
    split_type: random
trainer:
  _target_: lightning.pytorch.Trainer
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_epochs: 50
  min_epochs: 5
  deterministic: true
  benchmark: false
  log_every_n_steps: 10
  enable_progress_bar: true
  enable_model_summary: true
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 2
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
model:
  name: plain_cnn
  type: cnn
  vocab_size: 5
  padding_idx: 4
  embed_dim: 32
  dropout: 0.4
experiment:
  name: classical_stack_random
  description: the classical stack - 5 classical bases + multi-task GeneAttentionNet,
    K-fold OOF, LogReg meta
  antibiotics:
  - AMP
  - CIP
  - AMC
  - SXT
  - GEN
  - CTX
  - CAZ
  gene_stats:
  - mean
  - var
  - n_nonref
  - max
  n_folds: 5
  use_lgbm: true
  gan:
    max_epochs: 15
    batch_size: 16
    learning_rate: 0.001
    hidden_dim: 128
    n_heads: 4
    n_layers: 2
    ffn_mult: 2
    dropout: 0.3
  xgb_params:
    n_estimators: 1500
    max_depth: 5
    min_child_weight: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.7
    reg_alpha: 0.1
    reg_lambda: 1.0
    gamma: 0.1
    tree_method: hist
    device: cuda
    early_stopping_rounds: 150
  lgbm_params:
    num_leaves: 63
    max_depth: 6
    min_child_samples: 20
    learning_rate: 0.05
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.7
    reg_alpha: 0.1
    reg_lambda: 1.0
    early_stopping_rounds: 150
  rf_params:
    n_estimators: 200
    max_depth: 12
    min_samples_leaf: 10
  prefilter_top_k: 50000
  prefilter_min_variance: 1.0e-06
  xgb_raw_params:
    n_estimators: 1500
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 1.0
    colsample_bynode: 0.5
    reg_alpha: 0.1
    reg_lambda: 1.0
    tree_method: hist
    device: cuda
    early_stopping_rounds: 150
  meta_C: 1.0
  evaluation:
    bootstrap_n: 1000
    bootstrap_seed: 42
  output_dir: ${paths.results_dir}/classical_stack_random
  split_key: random_split
seed: 42
project_root: ${oc.env:TRILENS_ROOT,.}
paths:
  data_dir: ${project_root}/data
  processed_dir: ${project_root}/data/processed
  results_dir: ${project_root}/results
  checkpoints_dir: ${project_root}/checkpoints
  logs_dir: ${project_root}/logs
  arcadia_master_pkl: ${project_root}/data/processed/arcadia_v2_master_features.pkl
  arcadia_snp_matrix_pkl: ${project_root}/data/processed/arcadia_v2_snp_matrix.pkl
  giessen_data_csv: ${project_root}/data/Giessen_dataset/cip_ctx_ctz_gen_multi_data.csv
  giessen_pheno_csv: ${project_root}/data/Giessen_dataset/cip_ctx_ctz_gen_pheno.csv
wandb:
  project: amr-phylogene-mtl
  entity: null
  mode: ${oc.env:WANDB_MODE,offline}
  log_model: false
